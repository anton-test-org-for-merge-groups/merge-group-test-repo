name: Deployment testing

on:
  push:
    branches:
      - main

jobs:
  build-step:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-result
          path: beep.txt

  deploy-dev:
    environment: dev
    runs-on: ubuntu-latest
    needs: build-step
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download deploy artifact
        uses: actions/download-artifact@v7
        with:
          name: build-result
      - name: Fake deploy
        run: echo "Fake deploying $(cat beep.txt) to dev"

  deploy-stg:
    environment: stg
    runs-on: ubuntu-latest
    needs: build-step
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download deploy artifact
        uses: actions/download-artifact@v7
        with:
          name: build-result
      - name: Fake deploy
        run: echo "Fake deploying $(cat beep.txt) to stg"

  deploy-prod:
    environment: prod
    runs-on: ubuntu-latest
    needs: build-step
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download deploy artifact
        uses: actions/download-artifact@v7
        with:
          name: build-result
      - name: Fake deploy
        run: echo "Fake deploying $(cat beep.txt) to prod"
